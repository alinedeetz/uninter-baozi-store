spring.application.name=baozi-store

# Banco H2 em arquivo: os dados ficam em ./data e sobrevivem ao reinício
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
