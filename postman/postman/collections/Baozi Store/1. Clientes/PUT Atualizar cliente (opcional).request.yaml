url: "{{baseUrl}}/clientes/{{clienteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Aline dos Santos Mattos 5497233",
      "clienteDesde": "2026-10-01"
    }
scripts:
